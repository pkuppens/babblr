# Dependabot PRs require manual review; this job satisfies the required check without enabling auto-merge.
name: Dependabot Auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependabot-automerge:
    name: Enable auto-merge for Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Manual review required (auto-merge disabled)
        run: |
          echo "Dependabot PRs are not auto-merged in this repository."
          echo "A maintainer will review and merge after CI passes."
