# Secrets (CKAD domain 4). PLACEHOLDER VALUES ONLY — never commit real credentials.
# DB URL contains the password, so it lives here rather than in the ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: babblr-secrets
  namespace: babblr
type: Opaque
stringData:
  POSTGRES_PASSWORD: "devpassword-placeholder"
  BABBLR_CONVERSATION_DATABASE_URL: "postgresql+asyncpg://babblr:devpassword-placeholder@postgres:5432/babblr"
  ANTHROPIC_API_KEY: "placeholder-anthropic-key"
  GOOGLE_API_KEY: "placeholder-google-key"
