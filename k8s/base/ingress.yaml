# Nginx frontend proxies /api/ to the backend internally; the Ingress exposes the
# frontend. Reach with:  curl -H "Host: babblr.local" http://localhost/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: babblr
  namespace: babblr
spec:
  ingressClassName: nginx
  rules:
    - host: babblr.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
