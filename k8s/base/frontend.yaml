# Frontend: nginx-served Vite build (the K8s path; Electron is the desktop variant).
#   docker build -t babblr-frontend:dev frontend && kind load docker-image babblr-frontend:dev --name ckad
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: babblr
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: babblr-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: babblr
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
